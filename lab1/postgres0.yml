scope: my_cluster
name: postgresql0
restapi:
  listen: pg-master:8008
  connect_address: pg-master:8008
zookeeper:
  hosts:
    - zoo:2181
bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 10485760
    master_start_timeout: 300
    synchronous_mode: true
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        # wal_keep_segments убран в PostgreSQL 13. Для 15 это wal_keep_size.
        # 128MB — те же 8 сегментов по 16MB, что были в методичке.
        wal_keep_size: 128MB
        max_wal_senders: 10
        max_replication_slots: 10
        wal_log_hints: "on"
        archive_mode: "always"
        archive_timeout: 1800s
        archive_command: mkdir -p /tmp/wal_archive && test ! -f /tmp/wal_archive/%f && cp %p /tmp/wal_archive/%f
      pg_hba:
        - host replication replicator 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5
postgresql:
  listen: 0.0.0.0:5432
  connect_address: pg-master:5432
  data_dir: /var/lib/postgresql/data/postgresql0
  bin_dir: /usr/lib/postgresql/15/bin
  pgpass: /tmp/pgpass0
  # Если pg_rewind не смог подтянуть старый таймлайн (нода долго была мертва
  # и WAL уже уехал), каталог данных сносится и реплика собирается заново
  # через pg_basebackup. Так нода после возвращения сама получает строки,
  # записанные, пока её не было.
  remove_data_directory_on_rewind_failure: true
  remove_data_directory_on_diverged_timelines: true
  authentication:
    replication:
      username: replicator
      password: rep-pass
    superuser:
      username: postgres
      password: postgres
  parameters:
    # Сокет нельзя класть в data_dir: pg_rewind пытается открыть его как файл
    # и падает с "No such device or address". Тогда нода не догоняет кластер,
    # пока данные не снести целиком. /tmp этого не ломает.
    unix_socket_directories: /tmp
watchdog:
  mode: off
tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
